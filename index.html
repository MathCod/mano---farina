<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Mano & Farina Pizz</title>
</head>

<body>
  <header>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" class="navbar_logo">
      <defs>
        <style>
          .font-serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
          .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
          .bold { font-weight: 700; }
          .black { font-weight: 900; }
          .medium { font-weight: 500; }
        </style>
      </defs>

      <g id="Logo-Mano-Farina">
        <!-- Emblème / Pictogramme -->
        <g id="Embleme" transform="translate(2, 2)">
          <!-- Cercle Vert Signature (96x96px) -->
          <circle cx="48" cy="48" r="48" fill="#01762F" />
          
          <!-- Croûte / Arc supérieur doré -->
          <path d="M 26 34 Q 48 26 70 34" fill="none" stroke="#F6C878" stroke-width="4.5" stroke-linecap="round" />
          <!-- Part de pizza blanche -->
          <path d="M 30 40 L 48 70 L 66 40 Q 48 46 30 40 Z" fill="#ffffff" />
          <!-- Grains de blé / basilic -->
          <circle cx="48" cy="51" r="3.5" fill="#EE0004" />
          <circle cx="41" cy="44" r="2.8" fill="#000000" />
          <circle cx="55" cy="44" r="2.8" fill="#000000" />
        </g>

        <!-- Textes de marque -->
        <g id="Typo" transform="translate(115, 0)">
          <!-- Titre MANO & FARINA -->
          <text class="font-serif bold" x="0" y="44" font-size="28" fill="#111827" letter-spacing="1">
            MANO <tspan fill="#01762F">&amp;</tspan> FARINA
          </text>

          <!-- Badge PIZZ et sous-titre -->
          <g transform="translate(0, 56)">
            <rect width="50" height="20" rx="4" fill="#01762F" />
            <text class="font-sans black" x="25" y="14" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PIZZ</text>
            
            <text class="font-sans medium" x="62" y="14" font-size="10.5" fill="#6B7280" letter-spacing="1.8">
              ARTISANAL &amp; FEU DE BOIS
            </text>
          </g>
        </g>
      </g>
    </svg>

    <nav>
      <li>
          <ul><a href="#">ACCUEIL</a></ul>
          <ul><a href="#">À PROPOS</a></ul>
          <ul><a href="#">MENU</a></ul>
          <ul><a href="#">CONTACT</a></ul>
      </li>
    </nav>
  </header>
  <main>
  
  
  </main>
</body>
</html>
